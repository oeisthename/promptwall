[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptwall"
version = "0.1.0"
description = "Open source runtime security middleware for AI agents — prompt injection detection, policy enforcement, and tamper-evident audit logging."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Kair0s", email = "elmqiddemothmane@gmail.com" }
]
keywords = [
    "ai-security",
    "prompt-injection",
    "mcp",
    "llm-security",
    "agent-security",
    "audit-log",
    "policy-engine"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.103",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
postgres = [
    "psycopg2-binary>=2.9",
]

[project.scripts]
promptwall = "promptwall.api.main:run"

[project.urls]
Homepage = "https://github.com/oeisthename/promptwall"
Repository = "https://github.com/oeisthename/promptwall"
Issues = "https://github.com/oeisthename/promptwall/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
