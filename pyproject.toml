[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptwall"
version = "0.1.2"
description = "Enterprise-grade runtime security proxy for AI agents — prompt injection detection, policy enforcement, and tamper-evident audit logging."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Kair0s", email = "elmqiddemothmane@gmail.com" }
]
keywords = [
    "ai-security",
    "prompt-injection",
    "mcp",
    "llm-security",
    "agent-security",
    "audit-log",
    "policy-engine"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "websockets>=12.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27",
    "nodeenv>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.103",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
postgres = [
    "psycopg2-binary>=2.9",
]
dlp = [
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
    "spacy>=3.7.0",
]
ml = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface-hub>=0.23",
]

[project.scripts]
promptwall = "promptwall.cli.main:app_entry"

[project.urls]
Homepage = "https://github.com/oeisthename/promptwall"
Repository = "https://github.com/oeisthename/promptwall"
Issues = "https://github.com/oeisthename/promptwall/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build]
ignore-vcs = true
include = [
  "src/promptwall",
]

[tool.hatch.build.targets.wheel]
packages = ["src/promptwall"]
exclude = []
