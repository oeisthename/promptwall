version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: promptwall
      POSTGRES_PASSWORD: promptwallpassword
      POSTGRES_DB: promptwall_dashboard
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptwall -d promptwall_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgres://promptwall:promptwallpassword@postgres:5432/promptwall_dashboard
      - BETTER_AUTH_URL=http://localhost:3002
      - BETTER_AUTH_SECRET=supersecret123
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "8001:8000"
    environment:
      - PROMPTWALL_BASE_URL=http://dashboard:3000
      - PROMPTWALL_API_KEY=pw_live_4a79be05b39d728bff259f7d4e34e95e
    volumes:
      - promptwall-data:/root/.promptwall
    depends_on:
      - dashboard

volumes:
  pgdata:
  promptwall-data:
